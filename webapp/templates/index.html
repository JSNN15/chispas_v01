<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chispas - Tu Amigo Robot 🤖</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🤖 Chispas</h1>
            <p class="subtitle">Tu amigo robot</p>
        </header>

        <!-- Robot Face -->
        <div class="robot-container">
            <canvas id="robotFace" width="600" height="600"></canvas>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span id="statusText">Conectado</span>
            </div>
        </div>

        <!-- Speech Bubble -->
        <div class="speech-bubble" id="speechBubble">
            <p id="robotMessage">¡Hola! Soy Chispas 😊</p>
        </div>

        <!-- Controls -->
        <div class="controls">
            <!-- Voice Input -->
            <div class="voice-section">
                <button id="voiceBtn" class="btn-voice">
                    <span class="mic-icon">🎤</span>
                    <span id="voiceBtnText">Hablar</span>
                </button>
                <p class="voice-status" id="voiceStatus">Toca el micrófono para hablar</p>
            </div>

            <!-- Text Input -->
            <div class="text-input-section">
                <input type="text" id="textInput" placeholder="Escribe algo para Chispas..." maxlength="200">
                <button id="sendBtn" class="btn-send">Enviar</button>
            </div>

            <!-- Expression Buttons -->
            <div class="expression-buttons">
                <button class="btn-expression" data-expression="happy">😊 Feliz</button>
                <button class="btn-expression" data-expression="excited">🤩 Emocionado</button>
                <button class="btn-expression" data-expression="sad">😢 Triste</button>
                <button class="btn-expression" data-expression="surprised">😲 Sorprendido</button>
                <button class="btn-expression" data-expression="loving">😍 Amoroso</button>
                <button class="btn-expression" data-expression="sleepy">😴 Dormido</button>
            </div>

            <!-- Games Section -->
            <div class="games-section">
                <h3>🎮 Juegos</h3>
                <div class="game-buttons">
                    <button class="btn-game" data-game="colors">🎨 Colores</button>
                    <button class="btn-game" data-game="animals">🐶 Animales</button>
                    <button class="btn-game" data-game="songs">🎵 Canciones</button>
                    <button class="btn-game" data-game="numbers">🔢 Números</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>Hecho con ❤️ para Amanda</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/robot-face.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
